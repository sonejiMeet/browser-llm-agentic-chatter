provider: chatgpt
model: ""
urls:
  chatgpt: "https://chatgpt.com/"
  claude: "https://claude.ai/"
  gemini: "https://gemini.google.com/"
  perplexity: "https://www.perplexity.ai/"
  deepseek: "https://chat.deepseek.com/"
user_data_dir: "./browser_profile"
browser: chromium
headless: false
confirm_changes: true
# Reads disclose local source to the hosted model and require approval too.
confirm_reads: true
response_timeout_seconds: 300
response_settle_seconds: 1.0
# Off by default: a pause plus a Copy button is not proof of completion.
allow_copy_completion_fallback: false
max_browser_message_chars: 25000
protocol_repair_limit: 2
max_turns_before_summary: 15
shell_timeout_seconds: 90
max_output_bytes: 2000000
# Trusted local argv prefix for an externally configured sandbox launcher.
# This is not a sandbox itself; configure mounts, network and credentials externally.
execution_prefix: []
tools:
  shell:
    enabled: true
    # Empty selects powershell.exe on Windows, /bin/bash elsewhere.
    executable: ""
  file_write:
    enabled: true
  file_read:
    enabled: true
