# Target LLM chat provider
# Options: chatgpt, claude, gemini, perplexity
provider: chatgpt

# Model override (for multi-model providers like Perplexity)
# Leave empty to use the default model. Perplexity options:
# Sonar, Sonar Pro, Sonar Reasoning, GPT-4o, GPT-4o Mini,
# Claude 3.5 Sonnet, Claude 3 Opus, Gemini 2.0 Flash, Grok-2
model: ""

# Provider URLs
urls:
  chatgpt: "https://chatgpt.com/"
  claude: "https://claude.ai/"
  gemini: "https://gemini.google.com/"
  perplexity: "https://www.perplexity.ai/"

# Browser profile directory (stays logged in between runs)
user_data_dir: "./browser_profile"

# Which browser to automate
browser: chromium   # chromium, firefox, webkit

# Headless mode: false = you see the browser, true = hidden
headless: false

# Max conversation turns before auto-summarizing context (agent.py)
max_turns_before_summary: 15

# Tool execution
tools:
  shell:
    enabled: true
    # Shell executable — "powershell.exe" on Windows, blank for system default
    executable: "powershell.exe"
    timeout: 90
    dangerous_patterns:
      - "rm -rf"
      - "sudo "
      - "format "
      - "mkfs."
      - "dd if="
      - "chmod 777"
      - "Remove-Item -Recurse -Force"
  file_write:
    enabled: true
    # Restrict writes to the active workspace only (not the whole home tree).
    allowed_paths: ["."]
  file_read:
    enabled: true

# System prompt injected at the start of the browser chat session.
# agent_core.build_system_prompt() appends non-identifying ENVIRONMENT
# details (OS kind, shell, workspace folder name only — never full paths).
system_prompt: |
  You are connected to a local computer via a tool executor. When you output
  these markers, a program on the computer runs them and returns the results:

  [[[SHELL]]]
  command
  [[[END]]]

  [[[FILE path="./relative/path"]]]
  contents
  [[[END]]]

  [[[READ path="./relative/path"]]]

  The executor will reply with [TOOL OUTPUT] containing the results.
  Output plain text only — no markdown, no formatting.
